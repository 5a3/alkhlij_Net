<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260">
  <defs>
    <linearGradient id="bgBrown2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b2313"/>
      <stop offset="50%" stop-color="#4f301b"/>
      <stop offset="100%" stop-color="#6b4226"/>
    </linearGradient>
  </defs>
  <rect width="600" height="260" rx="20" fill="url(#bgBrown2)"/>
  <circle cx="510" cy="130" r="85" fill="#d97706" opacity="0.15"/>

  <!-- Badge -->
  <rect x="30" y="22" width="160" height="32" rx="16" fill="#d97706" opacity="0.25"/>
  <text x="110" y="43" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">🎁 عروض كروت البشير</text>
  
  <!-- Main Title -->
  <text x="30" y="96" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="26" font-weight="900" fill="#ffffff">أقوى الباقات لكافة الاستخدامات</text>
  
  <!-- Subtitle -->
  <text x="30" y="132" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="15" font-weight="700" fill="#f7f1e5">رصيد مضاعف وصلاحيات أطول مع شبكة البشير نت</text>

  <!-- Action Button -->
  <rect x="30" y="162" width="180" height="40" rx="20" fill="#8b572a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="120" y="187" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">استعرض نقاط البيع 📍</text>

  <!-- Right Graphic -->
  <g transform="translate(510, 130)">
    <rect x="-35" y="-24" width="70" height="48" rx="10" fill="#f7f1e5" opacity="0.2" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#f59e0b"/>
  </g>
</svg>